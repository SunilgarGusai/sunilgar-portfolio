name: Audit public repository hygiene

on:
  push:
    branches: [main]
    paths:
      - "data/repository-hygiene-policy.json"
      - "scripts/audit_repository_hygiene.py"
      - ".github/workflows/repository-hygiene-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio control repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit public GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_repository_hygiene.py
